# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
#
# pip.FDEP.SOP — the fdep provider.
#
# GENERATED by pdp-config/gen-scoped-policies.py from pdp-config/orgs.yaml
# and pdp-config/general-rules.yaml. Do not edit by hand: the next run
# overwrites this file.
#
# ── The shape of one call ───────────────────────────────────────────────────
# FDEP's app id is `@<org>.<c4-path>.<operation>`:
#
#     kind   = pip.FDEP.SOP          namespace.task_queue.workflow
#     id     = <c4 path>       e.g. systemone.LAYA
#     action = <operation>      e.g. Choice
#     attr   = { accessMode, riskLevel }
#
# There is no scope: the provider is the kind, and the app family inside it
# is the id. So one policy covers one provider, and the families are told
# apart by `R.id`.
#
# The rules here are the general rules, plus each app family's own.

apiVersion: api.cerbos.dev/v1

resourcePolicy:
  resource: pip.FDEP.SOP
  version: default
  rules:
    - name: admin-may-call-anything
      actions:
        - '*'
      roles:
        - FDEP_ADMIN
      effect: EFFECT_ALLOW
    - name: users-may-use-twseMops
      roles:
        - USERS
      actions:
        - todayMaterial
        - materialDetail
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: R.id == "twseMops"
