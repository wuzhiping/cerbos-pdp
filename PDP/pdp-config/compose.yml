# Cerbos PDP 推荐编排(Cerbos 0.57.0)
#
# 相对上游 wuzhiping/cerbos-pdp 的 compose.yml,加了一件事:
# 给 PDP 一个独立的数据卷,放策略数据库和审计库,不要写进 git 工作区。
#
# 起服务:
#   docker compose up -d
#
# ⚠️ 换存储驱动是一次迁移,不是改一行就完事:
#    磁盘目录里的策略**不会**自动进数据库。切过去之后 PDP 的策略集是空的,
#    在策略推过去之前,每个决策都会变成 DENY。
#    正确顺序见 pdp-config/README.md,推送用 pdp-config/push-policies.py。
#
# 部署策略(不用重启容器):
#   python3 pdp-config/push-policies.py --pdp http://<pdp>:3592 \
#       --policies config/policies
#
# 确认起来了:
#   curl -s http://127.0.0.1:3592/_cerbos/health
#   curl -s -u "cerbos:cerbosAdmin" http://127.0.0.1:3592/admin/policies
#   curl -s -u "cerbos:cerbosAdmin" \
#       'http://127.0.0.1:3592/admin/auditlog/list/KIND_DECISION?tail=1'

version: "3.6"

services:
  cerbos:
    image: ghcr.io/cerbos/cerbos:0.57.0
    restart: unless-stopped
    ports:
      - "3592:3592"
      # gRPC 的 3593 没有映射出去。决策 API 走 HTTP 就够了,
      # 只在需要 gRPC SDK 时才加上,而且别直接暴露到公网。
    volumes:
      # 服务器配置(.cerbos.yaml)。策略不再从这里读 ——
      # 它们在下面的数据库里。
      - ./config:/config
      # 策略数据库(cerbos.db)和审计库(audit/):
      #   - 不能写进 ./config,那是 git 工作区
      #   - 必须持久,否则重建容器就把策略全弄丢了
      - cerbos-data:/var/lib/cerbos
    command: [server, --config=/config/.cerbos.yaml, --set=telemetry.disabled=true]

  # Kafka 保留上游的配置。只有当 audit.backend 换成 kafka 时才需要它。
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    hostname: kafka
    volumes:
      - ./kafka:/tmp/kraft-combined-logs
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3

volumes:
  # 策略数据库和审计库。docker compose down 不会删它,除非加 -v。
  # 备份就是把这个卷里的 cerbos.db 拷出来。
  cerbos-data:
